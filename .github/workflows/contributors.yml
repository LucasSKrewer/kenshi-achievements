# Regenera o painel de contribuidores do README e publica no branch `contributors` (só a imagem, um
# commit). Fora do main, o commit do robô não entra na lista de contribuidores do GitHub.
name: Contribuidores

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  issues:
    types: [opened, labeled, unlabeled, deleted]
  push:
    branches: [main]

permissions:
  contents: write
  issues: read
  pull-requests: read  # sem isso a lista de issues não traz os PRs (traduções com i18n)

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/contributors.mjs "$RUNNER_TEMP/contributors.svg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publica no branch contributors se mudou
        run: |
          if git fetch -q origin contributors 2>/dev/null \
             && git show origin/contributors:contributors.svg > "$RUNNER_TEMP/old.svg" \
             && cmp -s "$RUNNER_TEMP/old.svg" "$RUNNER_TEMP/contributors.svg"; then
            echo "Painel sem mudança."
            exit 0
          fi
          git checkout -q --orphan panel
          git rm -rfq .
          cp "$RUNNER_TEMP/contributors.svg" contributors.svg
          git add contributors.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Painel de contribuidores"
          git push -qf origin panel:contributors
