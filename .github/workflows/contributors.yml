# Regenera assets/contributors.svg (painel de contribuidores do README) e commita se mudou.
name: Contribuidores

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  issues:
    types: [opened, labeled, unlabeled, deleted]
  push:
    branches: [main]
    paths-ignore: ['assets/contributors.svg']

permissions:
  contents: write
  issues: read

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/contributors.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commita se mudou
        run: |
          git add assets/contributors.svg
          if git diff --cached --quiet; then
            echo "Painel sem mudança."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Painel de contribuidores atualizado"
          git pull --rebase origin main
          git push origin HEAD:main
